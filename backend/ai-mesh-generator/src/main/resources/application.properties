spring.application.name=ai-mesh-generator

# Real keys live in a local .env file (git-ignored). Copy .env.example to .env and fill it in.
spring.config.import=optional:file:${ENV_FILE:.env}[.properties]

gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
gemini.image-model=${GEMINI_IMAGE_MODEL:gemini-2.5-flash-image}

# Tencent Cloud Hunyuan 3D (international site by default; see HunyuanProperties for the China site).
hunyuan.secret-id=${HUNYUAN_SECRET_ID:}
hunyuan.secret-key=${HUNYUAN_SECRET_KEY:}
hunyuan.region=${HUNYUAN_REGION:ap-singapore}
hunyuan.endpoint=${HUNYUAN_ENDPOINT:https://hunyuan.intl.tencentcloudapi.com}
hunyuan.version=${HUNYUAN_VERSION:2023-09-01}

# Where projects are saved (one folder per project). Relative to the working directory; git-ignored.
app.projects-dir=${PROJECTS_DIR:projects}
